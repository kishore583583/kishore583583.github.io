ss='search'>⌕ &nbsp; Search...</div><div class='date'>▣ &nbsp; Sep 10, 2026</div><div class='avatar'>PK</div></div></header><div class='submenu' id='submenu'></div><div id='pages'></div><script>const areas=[{id:'product',icon:'◆',name:'Product',status:'On Track',desc:'Intake, qualify, prioritize and route value opportunities.',m1:'18',l1:'New intakes',m2:'2.8d',l2:'Time to route'},{id:'engineering',icon:'⚙',name:'Engineering',status:'On Track',desc:'Combined execution across the Reliability engineering space.',m1:'88%',l1:'Portfolio progress',m2:'84',l2:'Active initiatives'},{id:'psmart',icon:'◉',name:'PSMART + AI',status:'Accelerating',desc:'Orchestration, onboarding efficiency and selective decision intelligence.',m1:'14.2K',l1:'Hours influenced',m2:'3',l2:'AI features live'},{id:'re',icon:'🔧',name:'Resolution Engineering',status:'Needs Attention',desc:'Durable fixes that reduce recurring incidents and operational effort.',m1:'310',l1:'Incidents avoided/yr',m2:'$1.8M',l2:'Realized value'},{id:'automation',icon:'ϟ',name:'Automation',status:'On Track',desc:'Automation at scale reduces toil and releases operational capacity.',m1:'14.2K',l1:'Hours removed',m2:'6.8',l2:'FTE-eq capacity'},{id:'monitoring',icon:'▥',name:'Monitoring & Advancement',status:'Healthy',desc:'Assess coverage, identify gaps, track remediation and validate closure.',m1:'87%',l1:'Coverage',m2:'31',l2:'Gaps closed'}];const NAV=[['home','Home'],['portfolio','Portfolio'],['weekly','Weekly Review'],['mywork','My Work'],['update','Update']];function home(){return `<section class='page' id='home'><div class='hero'><div class='eyebrow'>EXECUTIVE DASHBOARD</div><h1>Reliability ROI Dashboard</h1><p>Fewer disruptions. Higher productivity. Real financial value.</p><div class='hero-tools'><div class='quote'><b>“</b>Reliable systems enable healthier people tomorrow by creating capacity today.<div style='margin-top:5px;color:#758497'>— Reliability Leadership</div></div><div class='ytd'>▣ &nbsp; Year to Date (20 one' stroke='#12a052' stroke-width='2.6' stroke-dasharray='3 4'/><g fill='#9ad8ac'>${[35,40,45,49,56,62,68,76,84,93,101,108].map((h,i)=>`<rect x='${60+i*55}' y='${160-h}' width='24' height='${h}' rx='2'/>`).join('')}</g><g font-size='9' fill='#7a8797'>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<text x='${59+i*55}' y='178'>${m}</text>`).join('')}</g><text x='6' y='29' font-size='9' fill='#68778b'>$20M</text><text x='13' y='69' font-size='9' fill='#68778b'>$15M</text><text x='13' y='109' font-size='9' fill='#68778b'>$10M</text><text x='20' y='149' font-size='9' fill='#68778b'>$5M</text></svg></div><div class='legend'><span>● Value Realized</span><span>-- Forecast</span><span>·· Target</span></div></div><div class='card section'><div class='title'>▥ &nbsp; Intake Run Rate vs Delivery Throughput</div><div class='chart'><svg viewBox='0 0 620 190' preserveAspectRatio='none'><g stroke='#edf1ee'><line x1='40' y1='25' x2='600' y2='25'/><line x1='40' y1='65' x2='600' y2='65'/><line x1='40' y1='105' x2='600' y2='105'/><line x1='40' y1='145' x2='600' y2='145'/></g><line x1='40' y1='160' x2='600' y2='160' stroke='#cad4cf'/>${[62,70,88,75,55,51,58,68,72,78,73,80].map((v,i)=>`<rect x='${52+i*44}' y='${160-v}' width='14' height='${v}' rx='2' fill='#a9dfb6'/><rect x='${68+i*44}' y='${160-(v-10)}' width='14' height='${v-10}' rx='2' fill='#188e50'/>`).join('')}<g font-size='9' fill='#7a8797'>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<text x='${51+i*44}' y='178'>${m}</text>`).join('')}</g></svg></div><div class='grid2' style='grid-template-columns:1fr 1fr;gap:8px'><div class='sideStat'><b>72</b><span>Avg. monthly intake</span><div class='delta'>↗ +12% vs. Q4 ’25</div></div><div class='sideStat'><b>68</b><span>Avg. monthly delivered</span><div class='delta'>↗ +18% vs. Q4 ’25</div></div></div></div></div><div class='card' style='margin-top:10px'><div class='ophead'><div class='title'>♣ &nbsp; Relia ability Release</span><div class='prog'><i style='width:85%'></i></div><b>85%</b><span>Sep 30</span><span class='status'>On Track</span></div><div class='mrow'><span>Change Risk Intelligence</span><div class='prog'><i style='width:70%'></i></div><b>70%</b><span>Oct 15</span><span class='status'>On Track</span></div><div class='mrow'><span>Monitoring Platform Upgrade</span><div class='prog'><i style='width:40%'></i></div><b>40%</b><span>Nov 30</span><span class='sev med'>At Risk</span></div><div class='mrow'><span>Year-End Value Target</span><div class='prog'><i style='width:60%'></i></div><b>60%</b><span>Dec 31</span><span class='status'>On Track</span></div></div></div><div class='foot'><span>Reliability &nbsp; | &nbsp; People &nbsp; | &nbsp; Technology &nbsp; | &nbsp; Trust</span><span>Last updated: Sep 10, 2026 10:55 AM &nbsp; ● All systems operational</span></div></main></section>`}function detailPage(id,title,crumb,body){return `<section class='page' id='${id}'><div class='detailHero'><div class='crumb'>${crumb}</div><h1>${title}</h1><p>${body}</p></div><main class='detailMain'><div class='simpleKpis'><div class='card simple'><span>Portfolio Status</span><b>On Track</b><span>Improving WoW</span></div><div class='card simple'><span>Active Work</span><b>42</b><span>Across current portfolio</span></div><div class='card simple'><span>Realized Value</span><b>$1.8M</b><span>Validated YTD</span></div><div class='card simple'><span>Value at Risk</span><b>$0.42M</b><span>Needs attention</span></div></div></main></section>`}function portfolio(){return `<section class='page' id='portfolio'><div class='detailHero'><div class='crumb'>Reliability</div><h1>Portfolio</h1><p>Drill into Engineering, Product, and Monitoring & Advancement.</p></div><main class='detailMain'><div class='tree'><div class='card treeCard'><b>Engineering</b><div class='children'><div class='child' onclick="go('engineering')">Engineering Overview <span>›</span></div><div class='child' onclick="go('psmart')">PSMART + AI / Analytics <span>›</span></div><div class='child' onclick="go('re')">Resolution Engineering <span>›</span></div><div class='child' onclick="go('automation')">Automation Office <span>›</span></div></div></div><div class='card treeCard'><b>Product</b><div class='children'><div class='child' onclick="go('product')">Product Overview <span>›</span></div><div class='child'>Intake <span>›</span></div><div class='child'>Prioritization <span>›</span></div><div class='child'>Value Pipeline <span>›</span></div></div></div><div class='card treeCard'><b>Monitoring & Advancement</b><div class='children'><div class='child' onclick="go('monitoring')">Monitoring Overview <span>›</span></div><div class='child'>Coverage / Readiness <span>›</span></div><div class='child'>Gap Tracking <span>›</span></div><div class='child'>Validation <span>›</span></div></div></div></div></main></section>`}document.getElementById('pages').innerHTML=home()+portfolio()+detailPage('engineering','Engineering Portfolio','Portfolio › Engineering','Combined execution across PSMART + AI, Resolution Engineering and Automation Office.')+detailPage('psmart','PSMART + AI / Analytics','Portfolio › Engineering › PSMART + AI','Orchestration, onboarding efficiency and selective decision intelligence.')+detailPage('re','Resolution Engineering','Portfolio › Engineering › Resolution Engineering','Durable engineering fixes that eliminate recurring incidents and operational effort.')+detailPage('automation','Automation Office','Portfolio › Engineering › Automation','Automation that removes toil and releases operational capacity.')+detailPage('product','Product Front Door','Portfolio › Product','Intake, qualification, prioritization, routing and value hypothesis management.')+detailPage('monitoring','Monitoring & Advancement','Portfolio › Monitoring & Advancement','Assess coverage, identify gaps, coordinate remediation and validate closure.')+detailPage('weekly','Weekly Review','Reliability','Cross-portfolio
