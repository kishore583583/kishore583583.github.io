15fr .85fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 18px rgba(20,55,38,.04)}.kpi{padding:14px 15px;min-height:102px;display:grid;grid-template-columns:48px 1fr;gap:10px;cursor:pointer}.ico{width:45px;height:45px;border-radius:50%;background:#eaf7ee;display:grid;place-items:center;color:#0b7e3d;font-size:22px;font-weight:900}.khead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:850}.pill{font-size:10px;padding:4px 8px;border-radius:999px;background:#e9f7ed;color:#0a7b39;font-weight:800}.kval{font-size:30px;font-weight:900;margin:7px 0 4px}.delta{font-size:11px;color:#0d9145;font-weight:800}.subline{font-size:10px;color:#738196;margin-top:4px}.section{margin-top:10px;padding:13px 14px}.title{font-size:14px;font-weight:850;display:flex;align-items:center;gap:8px}.chart{height:186px;position:relative;margin-top:8px}.chart svg{width:100%;height:100%}.legend{font-size:10px;color:#68768a;display:flex;justify-content:center;gap:18px}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.sidebox{background:#f7faf8;border-radius:10px;padding:11px}.sidebox b{font-size:21px;display:block}.sidebox span{font-size:10px;color:#718095}.ophead{padding:11px 14px 5px;display:flex;justify-content:space-between;align-items:center}.link{color:#0b8240;font-size:10px;font-weight:800;cursor:pointer}.area{padding:12px;min-height:148px;cursor:pointer;transition:.15s}.area:hover{transform:translateY(-2px);border-color:#b8d8c2}.areaTop{display:flex;justify-content:space-between;align-items:center}.areaName{font-size:12px;font-weight:850}.areaDesc{font-size:10px;color:#66758a;min-height:34px;margin:8px 0}.ametrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid #eef2ef;padding-top:8px}.ametrics b{display:block;font-size:17px}.ametrics span{font-size:9px;color:#6f7f91}.pipe{padding:12px}.pipeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.pipeBox{border-radius:9px;padding:10px;background:#edf7ef;cursor:pointer}.pipeBox:nth-child(2){background:#f0f4f2}.pipeBox:nth-child(3){background:#eef2ef}.pipeBox:nth-child(4){background:#f4f6f5}.pipeBox b{display:block;font-size:23px;margin:7px 0 2px}.pipeBox span{font-size:9px;color:#66758a}.row{display:grid;grid-template-columns:9px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #edf1ee;font-size:10px}.row:last-child{border-bottom:0}.dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}.dot.red{background:var(--red)}.sev{padding:4px 8px;border-radius:999px;background:#fff0cf;color:#9d6200;font-size:9px}.mile{padding:12px}.mrow{display:grid;grid-template-columns:1.4fr 1fr 34px 65px 60px;gap:8px;align-items:center;padding:7px 0;font-size:9px}.prog{height:7px;border-radius:99px;background:#e8eeea;overflow:hidden}.prog i{display:block;height:100%;background:var(--g)}.ringWrap{display:flex;gap:12px;align-items:center;margin-top:10px}.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(#9fcfae 0 58%,#bddbc5 58% 81%,#d0ded4 81% 94%,#e6ebe8 94% 100%);position:relative;cursor:pointer}.ring:after{content:"$8.7M\A YTD";white-space:pre;position:absolute;inset:12px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:850;font-size:13px}.ringLegend{display:grid;gap:5px;font-size:9px;color:#5d6d7f}.ringLegend b{color:#10213a}.cta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:var(--g);color:#fff;padding:9px 12px;font-weight:800;cursor:pointer}.btn.sec{background:#fff;color:#34465e;border:1px solid var(--line)}.detailHero{padding:26px 28px 18px;background:linear-gradient(180deg,#fff,#f5faf7)}.crumb{font-size:10px;color:#8693a0}.detailHero h1{font-size:32px;margin:6px 0}.detailHero p{margin:0;color:#66758a}.detailMain{padding:0 24px 28px;max-width:1500px;margin:auto}.simpleKpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.simple{padding:14px}.simple b{font-size:25px;display:block;margin:5px 0}.simple span{font-size:10px;color:#6e7d8e}.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.treeCard{padding:16px}.children{display:grid;gap:7px;margin-top:12px}.child{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fafcfb;display:flex;justify-content:space-between;cursor:pointer;font-size:12px}.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.formCard{padding:15px;cursor:pointer}.formCard b{display:block;margin-bottom:6px}.formCard span{font-size:11px;color:#66758a}.formWrap{max-width:980px;margin:14px auto}.form{padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:750;color:#5e6e80;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6ded9;border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:85px}.full{grid-column:1/-1}.foot{display:flex;justify-content:space-between;padding:12px 4px 0;color:#758497;font-size:9px}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid6{grid-template-columns:repeat(3,1fr)}.grid2,.grid3,.tree,.forms{grid-template-columns:1fr}}@media(max-width:700px){.grid4,.grid6,.simpleKpis,.formgrid{grid-template-columns:1fr}.top{padding:0 12px}.wrap{padding:0 10px 20px}.hero h1{font-size:29px}}</style></head><body><header class="top"><div class="brand">Reliability</div><nav class="nav" id="nav"></nav><div class="avatar">PK</div></header><div class="sub" id="sub"></div><div id="pages"></div><script>const NAV=[['home','Home'],['portfolio','Portfolio'],['weekly','Weekly Review'],['mywork','My Work'],['update','Update']];const areas=[{id:'product',name:'Product',status:'On Track',desc:'Intake, qualify, prioritize and route value opportunities.',m1:'18',l1:'New intakes',m2:'2.8d',l2:'Time to route'},{id:'engineering',name:'Engineering',status:'On Track',desc:'Combined execution across the Reliability engineering space.',m1:'88%',l1:'Portfolio progress',m2:'84',l2:'Active initiatives'},{id:'psmart',name:'PSMART + AI',status:'Accelerating',desc:'Orchestration, onboarding efficiency and selective decision intelligence.',m1:'14.2K',l1:'Hours influenced',m2:'3',l2:'AI features live'},{id:'re',name:'Resolution Engineering',status:'Needs Attention',desc:'Durable fixes that reduce recurrence and restore service faster.',m1:'310',l1:'Incidents avoided / yr',m2:'2.4h',l2:'MTTR ↓ 35%'},{id:'automation',name:'Automation',status:'On Track',desc:'Automation at scale reduces toil and releases operational capacity.',m1:'14.2K',l1:'Hours removed',m2:'6.8',l2:'FTE-eq capacity'},{id:'monitoring',name:'Monitoring & Advancement',status:'Healthy',desc:'Assess coverage, identify gaps, track remediation and validate closure.',m1:'87%',l1:'Coverage',m2:'31',l2:'Gaps closed'}];function home(){return `<section class='page' id='home'><div class='hero'><div class='eye'>EXECUTIVE DASHBOARD</div><h1>Reliability ROI Dashboard</h1><p>Fewer disruptions. Higher productivity. Real financial value.</p></div><main class='wrap'><div class='grid4' style='margin-top:8px'>${kpi('✓','Incident Reduction','-42%','+8% vs plan','1,240 → 719 incidents YTD','weekly')}${kpi('◷','Toil Reduction','-38%','+6% vs plan','48,200 → 29,900 hours YTD','portfolio')}${kpi('↗','Capacity Released','18.3 FTE','+12% vs plan','Equivalent capacity returned to higher-value work','portfolio')}${kpi('$','Financial Value / ROI','$8.7M','+18% vs plan','$8.7M realized of $14.5M target','value')}</div><div class='grid2'><div class='card section'><div class='title'>Value Realized vs Forecast vs Target</div><div class='chart'><svg viewBox='0 0 760 190'><g stroke='#edf1ee'><line x1='45' y1='25' x2='735' y2='25'/><line x1='45' y1='65' x2='735' y2='65'/><line x1='45' y1='105' x2='735' y2='105'/><line x1='45' y1='145' x2='735' y2='145'/></g><polyline points='55,145 112,139 169,132 226,123 283,114 340,105 397,96 454,86 511,76 568,67 625,56 682,45' fill='none' stroke='#40546a' stroke-width='2.5' stroke-dasharray='7 6'/><polyline points='55,150 112,144 169,139 226,132 283,125 340,117 397,108 454,99 511,90 568,81 625,70 682,60' fill='none' stroke='#8ebea0' stroke-width='2.5' stroke-dasharray='3 4'/><g fill='#a9d8b6'>${[35,40,45,49,56,62,68,76,84,93,101,108].map((h,i)=>`<rect x='${60+i*55}' y='${160-h}' width='24' height='${h}' rx='2'/>`).join('')}</g><g font-size='9' fill='#7a8797'>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<text x='${59+i*55}' y='178'>${m}</text>`).join('')}</g></svg></div><div class='legend'><span>● Value Realized</span><span>-- Forecast</span><span>·· Target</span></div></div><div class='card section'><div class='title'>Intake Run Rate vs Delivery Throughput</div><div class='chart'><svg viewBox='0 0 620 190'>${[62,70,88,75,55,51,58,68,72,78,73,80].map((v,i)=>`<rect x='${52+i*44}' y='${160-v}' width='14' height='${v}' rx='2' fill='#b9dec3'/><rect x='${68+i*44}' y='${160-(v-10)}' width='14' height='${v-10}' rx='2' fill='#4f9c6d'/>`).join('')}<g font-size='9' fill='#7a8797'>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<text x='${51+i*44}' y='178'>${m}</text>`).join('')}</g></svg></div><div class='side'><div class='sidebox'><b>72</b><span>Avg monthly intake</span><div class='delta'>+12%</div></div><div class='sidebox'><b>68</b><span>Avg monthly delivered</span><div class='delta'>+18%</div></div></div></div></div><div class='card' style='margin-top:10px'><div class='ophead'><div class='title'>Reliability Operating Model — Weekly Status</div><div class='link' onclick="go('portfolio')">View All Areas →</div></div><div class='grid6' style='padding:0 8px 9px'>${areas.map(a=>`<div class='card area' onclick="go('${a.id}')"><div class='areaTop'><span class='areaName'>${a.name}</span><span>›</span></div><div style='margin-top:6px'><span class='pill'>● ${a.status}</span></div><div class='areaDesc'>${a.desc}</div><div class='ametrics'><div><b>${a.m1}</b><span>${a.l1}</span></div><div><b>${a.m2}</b><span>${a.l2}</span></div></div></div>`).join('')}</div></div><div class='grid3' style='margin-top:10px'><div class='card pipe'><div class='title'>Backlog & Pipeline <span style='margin-left:auto;font-size:10px'>Potential value: <b>$24.6M</b></span></div><div class='pipeGrid'><div class='pipeBox' onclick="go('portfolio')"><span>In Execution</span><b>28</b><span>$8.7M value</span></div><div class='pipeBox' onclick="go('portfolio')"><span>Ready Next</span><b>16</b><span>$5.4M value</span></div><div class='pipeBox' onclick="go('portfolio')"><span>Qualified Backlog</span><b>24</b><span>$6.8M value</span></div><div class='pipeBox' onclick="go('portfolio')"><span>Early Pipeline</span><b>37</b><span>$3.7M value</span></div></div></div><div class='card section'><div class='title'>Savings by Reliability Area</div><div class='ringWrap'><div class='ring' onclick="go('re')"></div><div class='ringLegend'><span><b>58%</b> Resolution Engineering</span><span><b>23%</b> Automation</span><span><b>13%</b> PSMART + AI</span><span><b>6%</b> Other / enabled</span></div></div><div class='subline'>Largest realized savings are currently associated with RE-delivered fixes.</div></div><div class='card mile'><div class='title'>Milestones & Outcome Health</div><div class='mrow'><span>Q3 Reliability Release</span><div class='prog'><i style='width:85%'></i></div><b>85%</b><span>Sep 30</span><span class='pill'>On Track</span></div><div class='mrow'><span>Change Risk Intelligence</span><div class='prog'><i style='width:70%'></i></div><b>70%</b><span>Oct 15</span><span class='pill'>On Track</span></div><div class='mrow'><span>Monitoring Upgrade</span><div class='prog'><i style='width:40%'></i></div><b>40%</b><span>Nov 30</span><span class='sev'>At Risk</span></div></div></div><div class='card section'><div class='title'>Leadership Attention</div><div class='row'><i class='dot red'></i><span>Payment system latency</span><span class='sev'>High</span></div><div class='row'><i class='dot'></i><span>Data reconciliation delays</span><span class='sev'>Medium</span></div><div class='row'><i class='dot'></i><span>Third-party dependency risk</span><span class='sev'>Medium</span></div><div class='cta'><button class='btn' onclick="openForm('intake')">Add Intake</button><button class='btn sec' onclick="openForm('weekly')">Weekly Status</button><button class='btn sec' onclick="openForm('value')">Record Value</button><button class='btn sec' onclick="openForm('milestone')">Milestone Update</button></div></div><div class='foot'><span>Reliability</span><span>Last updated: Sep 10, 2026</span></div></main></section>`}function kpi(icon,label,val,delta,sub,id){return `<div class='card kpi' onclick="go('${id}')"><div class='ico'>${icon}</div><div><div class='khead'><span>${label}</span><span class='pill'>● On Track</span></div><div class='kval'>${val}</div><div class='delta'>↗ ${delta}</div><div class='subline'>${sub}</div></div></div>`}function detail(id,title,crumb,desc,items){return `<section class='page' id='${id}'><div class='detailHero'><div class='crumb'>${crumb}</div><h1>${title}</h1><p>${desc}</p></div><main class='detailMain'><div class='simpleKpis'>${items.map(x=>`<div class='card simple'><span>${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div></main></section>`}function portfolio(){return `<section class='page' id='portfolio'><div class='detailHero'><div class='crumb'>Reliability</div><h1>Portfolio</h1><p>Drill into Engineering, Product, and Monitoring & Advancement.</p></div><main class='detailMain'><div class='tree'><div class='card treeCard'><b>Engineering</b><div class='children'><div class='child' onclick="go('engineering')">Engineering Overview <span>›</span></div><div class='child' onclick="go('psmart')">PSMART + AI <span>›</span></div><div class='child' onclick="go('re')">Resolution Engineering <span>›</span></div><div class='child' onclick="go('automation')">Automation Office <span>›</span></div></div></div><div class='card treeCard'><b>Product</b><div class='children'><div class='child' onclick="go('product')">Product Overview <span>›</span></div><div class='child' onclick="openForm('intake')">Add Intake <span>›</span></div></div></div><div class='card treeCard'><b>Monitoring & Advancement</b><div class='children'><div class='child' onclick="go('monitoring')">Monitoring Overview <span>›</span></div><div class='child'>Coverage / Readiness <span>›</span></div><div class='child'>Gap Tracking <span>›</span></div><div class='child'>Validation <span>›</span></div></div></div></div></main></section>`}function updateCenter(){return `<section class='page' id='update'><div class='detailHero'><div class='crumb'>Reliability</div><h1>Update Center</h1><p>Capture the source data used by the ROI and portfolio views.</p></div><main class='detailMain'><div class='forms'><div class='card formCard' onclick="openForm('intake')"><b>Add Intake</b><span>Problem, tower, expected incidents/tickets/toil/business benefit.</span></div><div class='card formCard' onclick="openForm('weekly')"><b>Weekly Status</b><span>Progress, trend, blockers, next commitment and ADO linkage.</span></div><div class='card formCard' onclick="openForm('value')"><b>Record Value</b><span>Expected, validated and realized benefit tied to Initiative ID.</span></div><div class='card formCard' onclick="openForm('milestone')"><b>Milestone Update</b><span>Target, forecast, status, dependency and confidence.</span></div></div><div id='formHost'></div></main></section>`}function openForm(type){go('update');const defs={intake:['Add Intake','Intake ID','Operational Domain','Unit','Tower','Outcome Type','Expected Annual Benefit','Problem / Opportunity'],weekly:['Weekly Status','Initiative ID','Reliability Area','Status','Progress %','Trend','ADO Work Item ID','This Week / Next Week'],value:['Record Value','Initiative ID','Outcome Type','Expected Benefit','Validated Benefit','Realized Benefit','Validation Date','Evidence / Notes'],milestone:['Milestone Update','Milestone ID','Milestone Name','Target Date','Forecast Date','Status','Confidence','Dependency / Leadership Help']};const d=defs[type];document.getElementById('formHost').innerHTML=`<div class='formWrap'><div class='card form'><div class='title'>${d[0]}</div><div class='formgrid' style='margin-top:12px'>${d.slice(1).map((x,i)=>`<div class='field ${i===6?'full':''}'><label>${x}</label>${i===6?'<textarea></textarea>':'<input>'}</div>`).join('')}<div class='full'><button class='btn' onclick="this.textContent='Saved'">Save</button></div></div></div></div>`}document.getElementById('pages').innerHTML=home()+portfolio()+detail('engineering','Engineering Portfolio','Portfolio › Engineering','Combined execution across PSMART + AI, Resolution Engineering and Automation Office.',[['Active Initiatives','84','Current portfolio'],['Realized Value','$3.6M','Validated YTD'],['Forecast Value','$5.6M','Current forecast'],['Milestones','6 / 8','On track']])+detail('psmart','PSMART + AI / Analytics','Portfolio › Engineering › PSMART + AI','Orchestration, onboarding efficiency and selective decision intelligence.',[['Active Work','24','Current'],['Hours Influenced','14.2K','Annualized'],['Change Risk','Live','Decision support'],['Analytics Features','3','Live / pilot']])+detail('re','Resolution Engineering','Portfolio › Engineering › Resolution Engineering','Durable fixes that reduce recurring incidents and improve restoration speed.',[['Incidents Avoided / Yr','310','Primary outcome'],['MTTR','2.4h','↓ 35%'],['Active','42','Engineering work'],['Realized Value','$1.8M','Secondary value metric']])+detail('automation','Automation Office','Portfolio › Engineering › Automation','Automation that removes toil and releases operational capacity.',[['Hours Removed','14.2K','Annualized'],['Capacity Released','6.8 FTE-eq','Annualized'],['Production','14','Automations'],['Realized Value','$0.9M','Validated']])+detail('product','Product Front Door','Portfolio › Product','Intake, qualification, prioritization, routing and value hypothesis management.',[['New Intakes','18','This week'],['Qualified','15','Current'],['Time to Route','2.8d','Improving'],['Pipeline Value','$6.3M','Expected']])+detail('monitoring','Monitoring & Advancement','Portfolio › Monitoring & Advancement','Assess coverage, identify gaps, coordinate remediation and validate closure.',[['Services Assessed','46','Current'],['Coverage','87%','Improving'],['Open Gaps','16','Current'],['Closed Gaps','31','Validated']])+detail('weekly','Weekly Review','Reliability','Cross-portfolio weekly movement, blockers and leadership asks.',[['Moved Forward','12','This week'],['Newly Blocked','4','This week'],['Unblocked','8','This week'],['No Movement >2w','6','Watch']])+detail('mywork','My Work','Reliability','Owned initiatives and updates due.',[['My Initiatives','8','Current'],['Updates Due','3','Action'],['Blocked','1','Help needed'],['Opportunities','2','New']])+updateCenter()+detail('value','Value Detail','Reliability › Value','Drill-through for realized and forecast value by area and initiative.',[['Realized','$8.7M','YTD'],['Target','$14.5M','Year end'],['Value at Risk','$1.7M','Blocked / aging'],['Largest Area','RE','58% of realized']]);document.getElementById('nav').innerHTML=NAV.map(([id,n])=>`<button data-id='${id}' onclick="go('${id}')">${n}</button>`).join('');function setSub(id){const s=document.getElementById('sub');if(['portfolio','engineering','psmart','re','automation','product','monitoring'].includes(id)){s.classList.add('show');s.innerHTML=`<button onclick="go('engineering')">Engineering</button><button onclick="go('psmart')">PSMART + AI</button><button onclick="go('re')">Resolution Engineering</button><button onclick="go('automation')">Automation</button><button onclick="go('product')">Product</button><button onclick="go('monitoring')">Monitoring & Advancement</button>`}else{s.classList.remove('show');s.innerHTML=''}}function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));(document.getElementById(id)||document.getElementById('home')).classList.add('on');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id||(['engineering','psmart','re','automation','product','monitoring'].includes(id)&&b.dataset.id==='portfolio')));setSub(id);location.hash=id;window.scrollTo({top:0,behavior:'smooth'})}go((location.hash||'#home').slice(1));</script></body></html>
