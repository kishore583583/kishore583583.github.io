<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Reliability V3</title><style>:root{--g:#15803d;--p:#eaf7ee;--ink:#10233d;--m:#667085;--l:#e5ebe7;--bg:#f6f9f7;--a:#f59e0b;--r:#dc2626;--b:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}header{height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:850;white-space:nowrap}.brand span{color:var(--g)}nav{display:flex;gap:6px;flex:1;overflow:auto}nav button{border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;color:#344054}nav button.on,nav button:hover{background:var(--p);color:#0b6f34;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:#205f87;color:#fff;display:grid;place-items:center;font-weight:800}.sub{display:none;background:#fff;border-bottom:1px solid var(--l);padding:9px 24px;gap:8px;position:sticky;top:64px;z-index:15}.sub.show{display:flex}.sub button{border:1px solid var(--l);background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.page{display:none}.page.on{display:block}.hero{padding:30px 32px 24px;background:radial-gradient(circle at 80% 10%,#dff3e5 0,transparent 35%),linear-gradient(180deg,#fff,#f8fbf9)}.eye{font-size:11px;letter-spacing:2.4px;color:var(--g);font-weight:850}.hero h1{font-size:38px;margin:7px 0}.hero p{margin:0;color:var(--m)}main{max-width:1600px;margin:auto;padding:0 26px 38px}.grid5,.grid4,.grid3,.grid2{display:grid;gap:14px}.grid5{grid-template-columns:repeat(5,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:2fr 1fr}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(16,35,61,.05)}.kpis{margin-top:-8px}.label{font-size:12px;color:var(--m);font-weight:700}.num{font-size:29px;font-weight:850;margin:5px 0}.up{font-size:12px;color:var(--g);font-weight:800}.bad{font-size:12px;color:var(--r);font-weight:800}.title{font-size:18px;font-weight:850;margin-bottom:11px}.area{cursor:pointer;transition:.15s}.area:hover{transform:translateY(-2px);border-color:#bad8c4}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px}.green{background:#e7f7ec;color:#0b7435}.amber{background:#fff2d7;color:#a85f00}.blue{background:#e8f2ff;color:#155fa8}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metric{background:#f8faf9;border:1px solid var(--l);border-radius:11px;padding:9px}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:var(--m)}.chart{height:220px;position:relative}.chart svg{width:100%;height:100%}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--l);font-size:12px}.row:last-child{border-bottom:0}.section{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}.section h2{font-size:17px;margin:0}.btn{border:0;border-radius:10px;background:var(--g);color:#fff;padding:9px 12px;font-weight:800;cursor:pointer}.btn.sec{background:#fff;color:#344054;border:1px solid var(--l)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}th{font-size:11px;color:var(--m);background:#fafcfb}.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tree .area{min-height:190px}.children{margin-top:11px;display:grid;gap:7px}.child{border:1px solid var(--l);background:#fbfcfb;border-radius:10px;padding:9px 10px;font-size:12px;display:flex;justify-content:space-between;cursor:pointer}.statusgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.statusbox{border:1px solid var(--l);border-radius:13px;padding:13px;background:#fbfcfb}.statusbox b{font-size:23px;display:block;margin-top:5px}.crumb{font-size:12px;color:var(--m);margin-bottom:8px}.filterrow{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.filter{border:1px solid var(--l);background:#fff;border-radius:9px;padding:8px 10px;font-size:12px}.footer{padding:18px 26px 28px;color:#7b8794;font-size:11px}@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}.grid4,.tree{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.grid5,.grid4,.grid3,.grid2,.tree,.statusgrid{grid-template-columns:1fr}.hero h1{font-size:30px}main{padding:0 14px 28px}}</style></head><body><header><div class='brand'><span>Reliability</span> Hub</div><nav id='nav'></nav><div class='avatar'>PK</div></header><div class='sub' id='sub'></div><div id='pages'></div><div class='footer'>Reliability V3 • Executive desktop review mock</div><script>const NAV=[['home','Home'],['portfolio','Portfolio'],['weekly','Weekly Review'],['mywork','My Work'],['update','Update']];const pages=document.getElementById('pages');const areas={engineering:{name:'Engineering',status:'On Track',cls:'green',a:'84',al:'Active',b:'$3.6M',bl:'Realized value',note:'Execution portfolio healthy; 2 shared dependencies need attention.'},product:{name:'Product',status:'On Track',cls:'green',a:'18',al:'New intakes',b:'2.8d',bl:'Time to route',note:'Intake quality improving; prioritization backlog is stable.'},monitoring:{name:'Monitoring & Advancement',status:'Stable',cls:'green',a:'87%',al:'Coverage',b:'16',bl:'Open gaps',note:'Coverage improving; 4 partner remediations await validation.'}};const eng={psmart:{name:'PSMART + AI / Analytics',status:'Accelerating',cls:'blue',a:'24',al:'Active items',b:'14.2K',bl:'Hours influenced',note:'Core value from orchestration/onboarding; AI adds decision support.'},re:{name:'Resolution Engineering',status:'Needs Attention',cls:'amber',a:'42',al:'Active',b:'$1.8M',bl:'Realized value',note:'Repeat issue elimination improving; 2 high-value blockers remain.'},automation:{name:'Automation Office',status:'On Track',cls:'green',a:'14',al:'Production',b:'14.2K',bl:'Hours removed',note:'Manual effort reduction and capacity release remain primary outcomes.'}};function card(label,v,d,bad=false){return `<div class='card'><div class='label'>${label}</div><div class='num'>${v}</div><div class='${bad?'bad':'up'}'>${d}</div></div>`}function areaCard(id,a,parent=''){return `<div class='card area' onclick="go('${id}')"><div class='head'><b>${a.name}</b><span class='pill ${a.cls}'>${a.status}</span></div><div class='metrics'><div class='metric'><b>${a.a}</b><span>${a.al}</span></div><div class='metric'><b>${a.b}</b><span>${a.bl}</span></div></div><div style='font-size:12px;color:var(--m);margin-top:10px'>${a.note}</div></div>`}function home(){return `<section class='page' id='home'><div class='hero'><div class='eye'>EXECUTIVE RELIABILITY</div><h1>Reliability ROI Dashboard</h1><p>One SVP/VP view of realized value, future pipeline, demand pressure, outcome trends and leadership attention.</p></div><main><div class='grid5 kpis'>${card('Realized Value','$5.2M','▲ 18% YTD')}${card('Forecast Value','$8.7M','▲ 12%')}${card('Value at Risk','$1.7M','12 aging / blocked items',true)}${card('Toil Hours Removed','14.2K','▲ 3.8K')}${card('Incident Reduction','9%','Improving')}</div><div class='grid2' style='margin-top:14px'><div class='card'><div class='title'>Portfolio Value Trend</div><div class='chart'><svg viewBox='0 0 700 220'><line x1='35' y1='185' x2='680' y2='185' stroke='#ccd5d0'/><line x1='35' y1='45' x2='35' y2='185' stroke='#ccd5d0'/><polyline points='40,170 140,160 240,148 340,132 440,116 540,96 650,78' fill='none' stroke='#2563eb' stroke-width='4' stroke-dasharray='8 6'/><polyline points='40,178 140,170 240,158 340,149 440,138 540,128 650,118' fill='none' stroke='#15803d' stroke-width='4'/><text x='575' y='72' font-size='12' fill='#2563eb'>$8.7M forecast</text><text x='575' y='121' font-size='12' fill='#15803d'>$5.2M realized</text></svg></div></div><div class='card'><div class='title'>Intake vs Delivery Run Rate</div><div class='row'><span>Intake growth</span><b>+18% YoY</b></div><div class='row'><span>Throughput growth</span><b>+9% YoY</b></div><div class='row'><span>Qualified backlog</span><b>64</b></div><div class='row'><span>Backlog value</span><b>$4.1M</b></div><div class='row'><span>Interpretation</span><b style='color:#a85f00'>Capacity pressure</b></div></div></div><div class='section'><h2>Value Contribution by Reliability Area</h2><button class='btn sec' onclick="go('portfolio')">Open Portfolio →</button></div><div class='grid3'>${areaCard('engineering',areas.engineering)}${areaCard('product',areas.product)}${areaCard('monitoring',areas.monitoring)}</div><div class='section'><h2>Leadership Attention</h2></div><div class='grid3'><div class='card'><div class='row'><span>High-value blocked work</span><b>$1.1M</b></div><div class='row'><span>Aging >45 days</span><b>7 items</b></div></div><div class='card'><div class='row'><span>Next-year qualified backlog</span><b>$4.1M</b></div><div class='row'><span>Early pipeline</span><b>$5.8M</b></div></div><div class='card'><div class='row'><span>Critical milestones</span><b>7 / 9 on track</b></div><div class='row'><span>Leadership decisions</span><b>3 required</b></div></div></div></main></section>`}function portfolio(){return `<section class='page' id='portfolio'><div class='hero'><div class='eye'>PORTFOLIO</div><h1>Reliability Portfolio</h1><p>Drill from the enterprise outcome into Engineering, Product, and Monitoring & Advancement.</p></div><main><div class='tree'><div class='card area'><div class='head'><b>Engineering</b><span class='pill green'>On Track</span></div><div class='metrics'><div class='metric'><b>$3.6M</b><span>Realized value</span></div><div class='metric'><b>84</b><span>Active initiatives</span></div></div><div class='children'><div class='child' onclick="go('engineering')">Engineering Overview <span>›</span></div><div class='child' onclick="go('psmart')">PSMART + AI / Analytics <span>›</span></div><div class='child' onclick="go('re')">Resolution Engineering <span>›</span></div><div class='child' onclick="go('automation')">Automation Office <span>›</span></div></div></div><div class='card area' onclick="go('product')"><div class='head'><b>Product</b><span class='pill green'>On Track</span></div><div class='metrics'><div class='metric'><b>18</b><span>New intakes</span></div><div class='metric'><b>$6.3M</b><span>Pipeline value</span></div></div><div style='font-size:12px;color:var(--m);margin-top:12px'>Front door for intake, value hypothesis, prioritization and routing.</div></div><div class='card area' onclick="go('monitoring')"><div class='head'><b>Monitoring & Advancement</b><span class='pill green'>Stable</span></div><div class='metrics'><div class='metric'><b>87%</b><span>Coverage</span></div><div class='metric'><b>16</b><span>Open gaps</span></div></div><div style='font-size:12px;color:var(--m);margin-top:12px'>Assess, identify gaps, coordinate remediation and validate closure.</div></div></div></main></section>`}function engineering(){return `<section class='page' id='engineering'><div class='hero'><div class='crumb'>Portfolio › Engineering</div><div class='eye'>ENGINEERING</div><h1>Engineering Portfolio</h1><p>Combined execution view across PSMART + AI, Resolution Engineering and Automation Office.</p></div><main><div class='grid4 kpis'>${card('Active Initiatives','84','↓ 6 WoW')}${card('Realized Value','$3.6M','▲ $0.4M')}${card('Forecast Value','$5.6M','▲ 9%')}${card('Milestones','6 / 8','On track')}</div><div class='section'><h2>Engineering Areas — Weekly Status</h2></div><div class='grid3'>${areaCard('psmart',eng.psmart)}${areaCard('re',eng.re)}${areaCard('automation',eng.automation)}</div></main></section>`}function product(){return `<section class='page' id='product'><div class='hero'><div class='crumb'>Portfolio › Product</div><div class='eye'>PRODUCT</div><h1>Product Front Door</h1><p>Capture the operational pain, expected benefit, priority and route every opportunity into the right Reliability path.</p></div><main><div class='grid4 kpis'>${card('New Intakes','18','▲ 6 WoW')}${card('Qualified','15','83%')}${card('Time to Route','2.8d','↓ 1.4d')}${card('Pipeline Value','$6.3M','▲ $0.8M')}</div><div class='section'><h2>Intake-to-Value Flow</h2></div><div class='grid4'><div class='card'><b>1. Intake</b><p class='label'>Problem + source metadata + expected incidents/tickets/toil/business benefit.</p></div><div class='card'><b>2. Qualify</b><p class='label'>Validate scope, outcome type, urgency and confidence.</p></div><div class='card'><b>3. Prioritize & Route</b><p class='label'>Engineering / Monitoring / Development based on fit and value.</p></div><div class='card'><b>4. Track Benefit</b><p class='label'>Expected → validated → realized outcome.</p></div></div></main></section>`}function monitoring(){return `<section class='page' id='monitoring'><div class='hero'><div class='crumb'>Portfolio › Monitoring & Advancement</div><div class='eye'>MONITORING & ADVANCEMENT</div><h1>Coverage, Gaps & Validation</h1><p>Assess observability readiness, identify gaps, coordinate remediation with partner teams and validate closure.</p></div><main><div class='grid4 kpis'>${card('Services Assessed','46','▲ 7')}${card('Coverage','87%','▲ 6 pts')}${card('Open Gaps','16','↓ 5')}${card('Closed Gaps','31','▲ 11')}</div></main></section>`}function psmart(){return `<section class='page' id='psmart'><div class='hero'><div class='crumb'>Portfolio › Engineering › PSMART + AI / Analytics</div><div class='eye'>PSMART + AI / ANALYTICS</div><h1>Orchestration, Onboarding & Decision Enablement</h1><p>Reduce SRE workflow friction and onboarding toil, while selectively adding forecasting, clustering and change-risk decision support.</p></div><main><div class='grid4 kpis'>${card('Active Work','24','▲ 4')}${card('Workflow / Onboarding Toil','14.2K hrs','Annualized influenced')}${card('Change Risk Assessment','Live','Manager decision support')}${card('Analytics Features','3','Forecasting / clustering / classification')}</div></main></section>`}function re(){return `<section class='page' id='re'><div class='hero'><div class='crumb'>Portfolio › Engineering › Resolution Engineering</div><div class='eye'>RESOLUTION ENGINEERING</div><h1>Resolution Engineering</h1><p>Eliminate recurring operational issues, deliver durable fixes and validate incident/toil/value outcomes.</p></div><main><div class='grid5 kpis'>${card('Active','42','↓ 6')}${card('Completed YTD','31','▲ 6')}${card('Incidents Avoided / Yr','310','▲ 12%')}${card('Realized Value','$1.8M','▲ $0.3M')}${card('Value at Risk','$0.42M','2 blocked',true)}</div><div class='filterrow'><select class='filter'><option>All RE Teams</option><option>Team 1</option><option>Team 2</option><option>Team 3</option><option>Team 4</option></select><select class='filter'><option>All Domains</option></select><select class='filter'><option>All Units</option></select><select class='filter'><option>All Towers</option></select></div><div class='section'><h2>Work Status</h2></div><div class='statusgrid'><div class='statusbox'><span class='pill blue'>Intake / Ready</span><b>18</b><span class='label'>Qualified work</span></div><div class='statusbox'><span class='pill green'>Active</span><b>42</b><span class='label'>Engineering in progress</span></div><div class='statusbox'><span class='pill amber'>Blocked / Hold</span><b>6</b><span class='label'>Dependency constrained</span></div><div class='statusbox'><span class='pill green'>Completed / Validate</span><b>31</b><span class='label'>Benefit validation</span></div></div><div class='section'><h2>Initiative Drill-Through</h2></div><div class='card'><table><tr><th>Initiative</th><th>Domain / Unit / Tower</th><th>RE Team</th><th>Status</th><th>Expected Outcome</th><th>Value</th></tr><tr><td>RE-101 • Recurring batch failure</td><td>Domain A / Unit 2 / Tower 4</td><td>Team 1</td><td><span class='pill green'>Active</span></td><td>60 incidents/yr avoided</td><td>$320K</td></tr><tr><td>RE-118 • Reconciliation defect</td><td>Domain B / Unit 3 / Tower 7</td><td>Team 3</td><td><span class='pill amber'>Blocked</span></td><td>18 tickets/mo avoided</td><td>$180K</td></tr></table></div></main></section>`}function automation(){return `<section class='page' id='automation'><div class='hero'><div class='crumb'>Portfolio › Engineering › Automation Office</div><div class='eye'>AUTOMATION OFFICE</div><h1>Automation Office</h1><p>Convert repetitive manual work into reusable automations that remove toil and release capacity.</p></div><main><div class='grid4 kpis'>${card('Production Automations','14','▲ 2')}${card('Hours Removed','14.2K','▲ 3.8K')}${card('Capacity Released','6.8 FTE-eq','Annualized')}${card('Realized Value','$0.9M','▲ $0.2M')}</div></main></section>`}function weekly(){return `<section class='page' id='weekly'><div class='hero'><div class='eye'>WEEKLY REVIEW</div><h1>Reliability Weekly Review</h1><p>Movement, blockers, value changes, milestone health and leadership asks across the entire Reliability layer.</p></div><main><div class='grid4 kpis'>${card('Moved Forward','12','▲ 4')}${card('Newly Blocked','4','↓ 2')}${card('Unblocked','8','▲ 3')}${card('No Movement >2w','6','↓ 1')}</div></main></section>`}function simple(id,title){return `<section class='page' id='${id}'><div class='hero'><div class='eye'>SELF SERVICE</div><h1>${title}</h1><p>Placeholder for the latest interactive workflow.</p></div><main><div class='card'>This page remains part of the application shell and will connect to SharePoint / ADO-backed records.</div></main></section>`}pages.innerHTML=home()+portfolio()+engineering()+product()+monitoring()+psmart()+re()+automation()+weekly()+simple('mywork','My Work')+simple('update','Update Center');document.getElementById('nav').innerHTML=NAV.map(([id,n])=>`<button data-id='${id}' onclick="go('${id}')">${n}</button>`).join('');function setSub(id){const s=document.getElementById('sub');if(id==='portfolio'||['engineering','psmart','re','automation','product','monitoring'].includes(id)){s.classList.add('show');s.innerHTML=`<button onclick="go('engineering')">Engineering</button><button onclick="go('psmart')">PSMART + AI</button><button onclick="go('re')">Resolution Engineering</button><button onclick="go('automation')">Automation</button><button onclick="go('product')">Product</button><button onclick="go('monitoring')">Monitoring & Advancement</button>`}else{s.classList.remove('show');s.innerHTML=''}}function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id||(id!=='home'&&['engineering','psmart','re','automation','product','monitoring'].includes(id)&&b.dataset.id==='portfolio')));setSub(id);location.hash=id;window.scrollTo({top:0,behavior:'smooth'})}go((location.hash||'#home').slice(1));</script></body></html>
