<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reliability V2</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--ink:#102033;--muted:#667085;--line:#e5e9e7;--green:#17a34a;--green2:#e8f7ed;--amber:#f4a61d;--red:#df3b46;--blue:#2487d6;--nav:#0d1e2a;--shadow:0 10px 30px rgba(14,35,26,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px 22px}.brand{font-size:20px;font-weight:800;white-space:nowrap}.brand span{color:var(--green)}.nav{display:flex;gap:6px;overflow-x:auto;flex:1}.nav button{border:0;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;color:#344054;white-space:nowrap}.nav button.active,.nav button:hover{background:var(--green2);color:#087236}.profile{width:34px;height:34px;border-radius:50%;background:#1c6bb0;color:white;display:grid;place-items:center;font-weight:800}.subnav{display:none;background:#fff;border-bottom:1px solid var(--line);padding:8px 22px;gap:8px;overflow:auto}.subnav.show{display:flex}.subnav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.subnav button:hover{background:#f2f7f4}.page{display:none}.page.active{display:block}.hero{padding:34px 30px 26px;background:radial-gradient(circle at 82% 0,#dff3e5 0,transparent 36%),linear-gradient(180deg,#fff 0,#f8fbf9 100%)}.eyebrow{color:var(--green);font-size:12px;letter-spacing:2.5px;font-weight:800}.hero h1{font-size:38px;line-height:1.05;margin:8px 0}.hero p{margin:0;color:var(--muted);font-size:16px}.content{padding:0 24px 34px;max-width:1600px;margin:auto}.grid5,.grid6,.grid3,.grid2{display:grid;gap:14px}.grid5{grid-template-columns:repeat(5,1fr)}.grid6{grid-template-columns:repeat(6,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:2fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}.kpis{margin-top:-10px}.kpi{cursor:pointer;transition:.18s transform,.18s box-shadow}.kpi:hover,.area:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(14,35,26,.10)}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:30px;font-weight:850;margin:4px 0}.delta{font-size:12px;font-weight:800}.up{color:var(--green)}.down{color:var(--red)}.section-title{font-size:18px;font-weight:800;margin-bottom:12px}.chart{height:220px;position:relative;padding:16px 10px 8px}.chart svg{width:100%;height:100%}.range{display:flex;gap:6px;justify-content:flex-end}.range button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}.range button.active{background:var(--nav);color:#fff}.donut-wrap{display:flex;align-items:center;gap:20px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(#0f766e 0 44%,#75c352 44% 72%,#228be6 72% 90%,#7c3aed 90% 100%);position:relative}.donut:after{content:"$8.7M\A Predicted";white-space:pre;position:absolute;inset:30px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800}.legend{display:grid;gap:10px;font-size:13px}.legend span{display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.week-item,.lead-item,.mile-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.week-item:last-child,.lead-item:last-child,.mile-item:last-child{border-bottom:0}.area-section{margin-top:14px}.area{cursor:pointer;min-height:172px;transition:.18s transform,.18s box-shadow}.area-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.area-title{font-size:15px;font-weight:850}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.green{background:#e7f7ec;color:#0d7b38}.amber{background:#fff3d8;color:#b36a00}.blue{background:#e8f3ff;color:#116fba}.area-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fafcfb}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted)}.mini{font-size:12px;color:var(--muted);margin-top:10px}.footer-grid{margin-top:14px}.btn{border:0;border-radius:10px;background:var(--green);color:white;padding:10px 13px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px}.pill{padding:4px 8px;border-radius:999px;background:var(--green2);color:#087236;font-size:11px;font-weight:800}.drawer{position:fixed;right:-440px;top:0;width:420px;max-width:92vw;height:100vh;background:#fff;z-index:50;box-shadow:-20px 0 50px rgba(0,0,0,.12);transition:.25s right;padding:22px;overflow:auto}.drawer.open{right:0}.drawer h3{margin-top:0}.close{float:right;border:0;background:#f2f4f7;border-radius:50%;width:32px;height:32px;cursor:pointer}.overlay{position:fixed;inset:0;background:rgba(12,20,25,.25);display:none;z-index:40}.overlay.show{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d6dbe0;border-radius:9px;background:#fff}.field textarea{min-height:90px}.full{grid-column:1/-1}.detail-hero{display:flex;align-items:end;justify-content:space-between;gap:20px}.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quote{font-size:12px;color:var(--muted);font-style:italic;margin-top:10px}.trendbox{display:flex;gap:18px;align-items:center}.bigtrend{font-size:42px;font-weight:850}.smalltext{font-size:12px;color:var(--muted)}
@media(max-width:1200px){.grid5{grid-template-columns:repeat(3,1fr)}.grid6{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.grid5,.grid6,.grid3,.grid2,.form{grid-template-columns:1fr}.hero h1{font-size:30px}.content{padding:0 14px 28px}.topbar{padding:10px 12px}.hero{padding:26px 18px 20px}.donut-wrap{align-items:flex-start}.grid5{margin-top:0}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span>Reliability</span> Hub</div><nav class="nav" id="nav"></nav><div class="profile">PK</div></header>
<div class="subnav" id="subnav"></div>
<main id="pages"></main>
</div>
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><button class="close" onclick="closeDrawer()">×</button><div id="drawerContent"></div></aside>
<script>
const NAV=[['home','Home'],['product','Product'],['engineering','Engineering'],['psmart','PSMART + AI'],['re','Resolution Engineering'],['automation','Automation'],['monitoring','Monitoring'],['weekly','Weekly Review'],['mywork','My Work'],['update','Update']];
const AREAS={
product:{name:'Product',status:'On Track',cls:'green',m1:'18',l1:'New intakes',m2:'2.8d',l2:'Time to route',note:'15 qualified • 12 prioritized • 10 routed',detail:'Intake quality improved this week. One intake is waiting on business prioritization.'},
engineering:{name:'Engineering',status:'On Track',cls:'green',m1:'70%',l1:'Portfolio progress',m2:'84',l2:'Active initiatives',note:'6/8 milestones on track • $3.6M value',detail:'Engineering portfolio improved 5 pts WoW. Main watch item is dependency aging across two shared services.'},
psmart:{name:'PSMART + AI',status:'Accelerating',cls:'blue',m1:'$1.5M',l1:'Value enabled',m2:'24',l2:'Active use cases',note:'76% on track • 3 promoted to action',detail:'Classification v2 and anomaly correlation drove most of this week’s movement.'},
re:{name:'Resolution Engineering',status:'Needs Attention',cls:'amber',m1:'2.4h',l1:'MTTR',m2:'42',l2:'Active RE',note:'31 completed YTD • 4 blocked',detail:'Two initiatives are blocked on access and one is waiting for Dev capacity. Repeat incidents are trending down.'},
automation:{name:'Automation',status:'On Track',cls:'green',m1:'14.2K',l1:'Hours removed',m2:'98%',l2:'Success rate',note:'14 production automations • $0.9M value',detail:'Five automations were promoted this week with no major production failures.'},
monitoring:{name:'Monitoring & Advancement',status:'Stable',cls:'green',m1:'87%',l1:'Coverage',m2:'16',l2:'Open gaps',note:'31 gaps closed • 46 services assessed',detail:'Coverage improved 6 pts. Four gaps are waiting on partner remediation before M&A validation.'}
};
function navHtml(){return NAV.map(([id,n])=>`<button data-id="${id}" onclick="go('${id}')">${n}</button>`).join('')}
function kpi(label,value,delta,good=true,detail=''){return `<div class="card kpi" onclick="openDrawer('${label}','${value}','${detail}')"><div class="label">${label}</div><div class="value">${value}</div><div class="delta ${good?'up':'down'}">${delta}</div></div>`}
function home(){return `<section class="page" id="home"><div class="hero"><div class="eyebrow">EXECUTIVE RELIABILITY</div><h1>A more resilient organization</h1><p>Fewer disruptions. Faster resolution. Greater value. One weekly view with drill-through into every Reliability area.</p></div><div class="content"><div class="grid5 kpis">${kpi('Predicted Savings (YTD)','$8.7M','▲ 12%',true,'Forecast based on active and planned initiatives. Click area cards below to see contribution drivers.')}${kpi('Realized Savings (YTD)','$5.2M','▲ 18%',true,'Realized value recorded to date. Attribution should remain primary/supporting/enabler to avoid double counting.')}${kpi('Progress to Year End','60%','On track for $14.5M',true,'Current trajectory versus annual target.')}${kpi('Open Critical Issues','12','▲ 3',false,'2 items have been aging more than 30 days and require leadership attention.')}${kpi('Reliability Health','82 / 100','▲ 6',true,'Composite health across delivery, risk, value and trend.')}</div><div class="grid3" style="margin-top:14px"><div class="card" style="grid-column:span 2"><div style="display:flex;justify-content:space-between;align-items:center"><div class="section-title">Value Realization</div><div class="range"><button class="rbtn" onclick="setRange(this,'4W')">4W</button><button class="rbtn" onclick="setRange(this,'8W')">8W</button><button class="rbtn active" onclick="setRange(this,'YTD')">YTD</button></div></div><div class="chart"><svg viewBox="0 0 700 220" preserveAspectRatio="none"><line x1="35" y1="185" x2="680" y2="185" stroke="#ccd5d0"/><line x1="35" y1="40" x2="35" y2="185" stroke="#ccd5d0"/><line x1="35" y1="78" x2="680" y2="78" stroke="#aeb8b2" stroke-dasharray="5 5"/><polyline points="40,160 140,145 240,130 340,118 440,112 540,90 650,80" fill="none" stroke="#2487d6" stroke-width="4" stroke-dasharray="9 7"/><polyline points="40,172 140,161 240,148 340,139 440,132 540,124 650,118" fill="none" stroke="#17a34a" stroke-width="4"/><text x="560" y="71" font-size="12" fill="#667085">$14.5M target</text><text x="590" y="95" font-size="12" fill="#2487d6">$8.7M predicted</text><text x="590" y="124" font-size="12" fill="#17a34a">$5.2M realized</text></svg></div></div><div class="card"><div class="section-title">Value Mix (YTD)</div><div class="donut-wrap"><div class="donut"></div><div class="legend"><span><i class="dot" style="background:#0f766e"></i>44% Cost Avoidance</span><span><i class="dot" style="background:#75c352"></i>28% Productivity</span><span><i class="dot" style="background:#228be6"></i>18% Automation</span><span><i class="dot" style="background:#7c3aed"></i>10% Risk Reduction</span></div></div></div></div><div class="area-section"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="section-title" style="margin:0">Reliability Operating Model — Weekly Status</div><button class="btn secondary" onclick="go('weekly')">View Weekly Review</button></div><div class="grid6">${Object.entries(AREAS).map(([id,a])=>`<div class="card area" onclick="go('${id}')"><div class="area-top"><div class="area-title">${a.name}</div><div>›</div></div><div style="margin-top:9px"><span class="status ${a.cls}">${a.status}</span></div><div class="area-metrics"><div class="metric"><b>${a.m1}</b><span>${a.l1}</span></div><div class="metric"><b>${a.m2}</b><span>${a.l2}</span></div></div><div class="mini">${a.note}</div></div>`).join('')}</div></div><div class="grid3 footer-grid"><div class="card"><div class="section-title">Leadership Attention</div><div class="lead-item"><span>Payment system latency</span><span class="status amber">High</span></div><div class="lead-item"><span>Claims data reconciliation</span><span class="status amber">Medium</span></div><div class="lead-item"><span>Provider onboarding delay</span><span class="status amber">Medium</span></div></div><div class="card"><div class="section-title">Critical Milestones</div><div class="mile-item"><span>Q3 Reliability Release</span><span class="status green">On Track</span></div><div class="mile-item"><span>AI Anomaly Detection Phase 1</span><span class="status green">On Track</span></div><div class="mile-item"><span>Monitoring Platform Upgrade</span><span class="status amber">At Risk</span></div></div><div class="card"><div class="section-title">Quick Actions</div><div class="quick-actions"><button class="btn secondary" onclick="go('update')">Update Status</button><button class="btn secondary" onclick="go('weekly')">Weekly Review</button><button class="btn secondary" onclick="go('mywork')">My Work</button><button class="btn secondary" onclick="openDrawer('Export','Executive report','Export can later be wired to PDF/PowerPoint generation.')">Export Report</button></div><div class="quote">“Reliability is how we create measurable resilience, not just how we report it.”</div></div></div></div></section>`}
function detail(id){const a=AREAS[id]||{name:NAV.find(x=>x[0]===id)?.[1]||id,status:'On Track',cls:'green',m1:'72%',l1:'Progress',m2:'18',l2:'Active items',note:'Weekly movement available',detail:'Area detail'};return `<section class="page" id="${id}"><div class="hero"><div class="detail-hero"><div><div class="crumb">Reliability › ${a.name}</div><div class="eyebrow">AREA PERFORMANCE</div><h1>${a.name}</h1><p>${a.detail}</p></div><span class="status ${a.cls}">${a.status}</span></div></div><div class="content"><div class="grid5 kpis">${kpi(a.l1,a.m1,'▲ WoW',true,a.detail)}${kpi(a.l2,a.m2,'Current',true,a.note)}${kpi('Completed YTD','31','▲ 6',true,'Completed work this year.')}${kpi('Blocked','4','▼ 3',true,'Blocked items decreased this week.')}${kpi('Forecast value','$1.8M','▲ $0.3M',true,'Forecast value attributed to this area.')}</div><div class="grid2" style="margin-top:14px"><div class="card"><div class="section-title">Week-over-Week Performance</div><table class="table"><tr><th>Metric</th><th>Last Week</th><th>This Week</th><th>Direction</th></tr><tr><td>Completion</td><td>64%</td><td>69%</td><td><span class="status green">Improving</span></td></tr><tr><td>Open backlog</td><td>42</td><td>38</td><td><span class="status green">Improving</span></td></tr><tr><td>Blocked</td><td>7</td><td>4</td><td><span class="status green">Improving</span></td></tr><tr><td>Aging &gt; 60d</td><td>5</td><td>4</td><td><span class="status green">Improving</span></td></tr></table></div><div class="card"><div class="section-title">Why it moved</div><div class="week-item"><span>Moved forward</span><b class="up">12</b></div><div class="week-item"><span>Newly blocked</span><b class="down">4</b></div><div class="week-item"><span>Unblocked</span><b class="up">8</b></div><div class="week-item"><span>No movement &gt;2w</span><b>6</b></div></div></div><div class="grid3" style="margin-top:14px"><div class="card"><div class="section-title">Top initiatives</div><div class="lead-item"><span>Initiative A</span><span class="pill">80%</span></div><div class="lead-item"><span>Initiative B</span><span class="pill">65%</span></div><div class="lead-item"><span>Initiative C</span><span class="pill">55%</span></div></div><div class="card"><div class="section-title">Dependencies</div><div class="lead-item"><span>Access approval</span><span class="status amber">Open</span></div><div class="lead-item"><span>Dev capacity</span><span class="status amber">Open</span></div><div class="lead-item"><span>Validation slot</span><span class="status green">Ready</span></div></div><div class="card"><div class="section-title">Leadership help</div><p class="smalltext">Prioritize shared-service access and confirm capacity for the two aging handoffs.</p><button class="btn" onclick="go('weekly')">Open Weekly Review</button></div></div></div></section>`}
function weekly(){return `<section class="page" id="weekly"><div class="hero"><div class="eyebrow">MEETING VIEW</div><h1>Weekly Reliability Review</h1><p>One place to see movement, exceptions, leadership asks and cross-area relationships.</p></div><div class="content"><div class="grid5 kpis">${kpi('Moved Forward','12','▲ 4',true,'Items that advanced stage this week.')}${kpi('Newly Blocked','4','▼ 2',true,'New blockers identified this week.')}${kpi('Unblocked','8','▲ 3',true,'Previously blocked items that resumed.')}${kpi('No Movement >2w','6','▼ 1',true,'Stalled items requiring review.')}${kpi('Leadership Asks','3','1 urgent',false,'Decisions or escalations needed from leadership.')}</div><div class="card" style="margin-top:14px"><div class="section-title">Area status</div><table class="table"><tr><th>Area</th><th>Status</th><th>WoW</th><th>Primary driver</th><th>Action</th></tr>${Object.entries(AREAS).map(([id,a],i)=>`<tr><td>${a.name}</td><td><span class="status ${a.cls}">${a.status}</span></td><td>${i%2?'+3 pts':'+5 pts'}</td><td>${a.note}</td><td><button class="btn secondary" onclick="go('${id}')">Drill through</button></td></tr>`).join('')}</table></div></div></section>`}
function mywork(){return `<section class="page" id="mywork"><div class="hero"><div class="eyebrow">PERSONAL VIEW</div><h1>My Work</h1><p>Your active initiatives, updates due, blockers and ADO references.</p></div><div class="content"><div class="card"><table class="table"><tr><th>Initiative</th><th>Area</th><th>Status</th><th>Progress</th><th>ADO</th><th></th></tr><tr><td>RE-101 • EDW failures</td><td>Resolution Engineering</td><td><span class="status green">Green</span></td><td>80%</td><td>4100</td><td><button class="btn" onclick="go('update')">Update</button></td></tr><tr><td>AI-101 • Classification v2</td><td>PSMART + AI</td><td><span class="status blue">Accelerating</span></td><td>76%</td><td>4101</td><td><button class="btn" onclick="go('update')">Update</button></td></tr></table></div></div></section>`}
function update(){return `<section class="page" id="update"><div class="hero"><div class="eyebrow">SELF SERVICE</div><h1>Update Center</h1><p>Append weekly status and enrich it with Reliability and Azure DevOps metadata.</p></div><div class="content"><div class="card"><form class="form" onsubmit="save(event)"><div class="field"><label>Initiative ID</label><input name="initiativeId" value="RE-101"></div><div class="field"><label>Intake ID</label><input name="intakeId" value="INT-1042"></div><div class="field"><label>Reliability Area</label><select name="team"><option>Resolution Engineering</option><option>PSMART + AI</option><option>Automation</option><option>Monitoring & Advancement</option><option>Product</option></select></div><div class="field"><label>Status</label><select name="status"><option>Green</option><option>Amber</option><option>Red</option></select></div><div class="field"><label>Progress %</label><input type="number" name="progress" value="72"></div><div class="field"><label>Trend</label><select name="trend"><option>Improving</option><option>Stable</option><option>Declining</option></select></div><div class="field"><label>ADO Work Item ID</label><input name="ado" value="4100"></div><div class="field"><label>ADO Work Item Type</label><select name="type"><option>Epic</option><option>Feature</option><option>User Story</option><option>Task</option></select></div><div class="field full"><label>This week progress</label><textarea name="week">Implementation progressed and blocker removed.</textarea></div><div class="field full"><label>Next week commitment</label><textarea name="next">Move to validation.</textarea></div><div class="field"><label>Forecast value</label><input name="forecast" value="400000"></div><div class="field"><label>Realized value</label><input name="realized" value="250000"></div><div class="full"><button class="btn">Save weekly update</button> <span id="saved" class="smalltext"></span></div></form></div></div></section>`}
function pages(){return home()+detail('product')+detail('engineering')+detail('psmart')+detail('re')+detail('automation')+detail('monitoring')+weekly()+mywork()+update()}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');const n=document.querySelector(`.nav button[data-id="${id}"]`);if(n)n.classList.add('active');location.hash=id;renderSubnav(id);window.scrollTo({top:0,behavior:'smooth'})}
function renderSubnav(id){const s=document.getElementById('subnav');if(id==='engineering'){s.className='subnav show';s.innerHTML=`<button onclick="go('engineering')">Overview</button><button onclick="go('psmart')">PSMART + AI</button><button onclick="go('re')">Resolution Engineering</button><button onclick="go('automation')">Automation Office</button>`}else if(id==='weekly'){s.className='subnav show';s.innerHTML=`<button>Executive Summary</button><button onclick="openDrawer('Area Status','6 areas','All Reliability areas are summarized on the weekly review table with drill-through.')">Area Status</button><button onclick="openDrawer('Blockers','4 new','Two access, one Dev capacity, one validation scheduling blocker.')">Blockers</button><button onclick="openDrawer('Milestones','7/9 on track','Monitoring platform upgrade is the primary at-risk milestone.')">Milestones</button><button onclick="openDrawer('Value','$5.2M realized','Predicted $8.7M against $14.5M year-end target.')">Value</button>`}else{s.className='subnav';s.innerHTML=''}}
function setRange(btn,label){document.querySelectorAll('.rbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');openDrawer('Value Realization — '+label,label,'Trajectory view changed. In the production version this will re-query the selected reporting window.')}
function openDrawer(title,value,detail){document.getElementById('drawerContent').innerHTML=`<div class="eyebrow">DRILL-DOWN</div><h3>${title}</h3><div class="value">${value}</div><p class="smalltext">${detail}</p><div class="card" style="box-shadow:none"><div class="section-title">What changed this week</div><div class="week-item"><span>Positive movement</span><b class="up">+5</b></div><div class="week-item"><span>New risk</span><b class="down">1</b></div><div class="week-item"><span>Leadership action</span><b>Review</b></div></div>`;document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function save(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());const arr=JSON.parse(localStorage.getItem('reliabilityUpdates')||'[]');arr.push({...data,ts:new Date().toISOString()});localStorage.setItem('reliabilityUpdates',JSON.stringify(arr));document.getElementById('saved').textContent='Saved locally • '+arr.length+' update(s)'}
document.getElementById('nav').innerHTML=navHtml();document.getElementById('pages').innerHTML=pages();go((location.hash||'#home').slice(1));window.addEventListener('hashchange',()=>go((location.hash||'#home').slice(1)));
</script>
</body>
</html>
