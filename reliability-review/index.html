<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Reliability Executive Hub</title><style>:root{--g:#0b8f52;--g2:#dff5e8;--ink:#102033;--mut:#6b7280;--line:#e6ebef;--bg:#f5f8f6;--card:#fff;--bad:#c0392b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:14px 22px}.brand{font-size:22px;font-weight:800}nav{display:flex;gap:7px;overflow:auto;flex:1}nav button{border:0;background:transparent;padding:10px 12px;border-radius:12px;white-space:nowrap;cursor:pointer;color:#334155}nav button.on{background:var(--g2);color:#08743f;font-weight:800}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#111827;color:#fff;font-weight:800}.page{display:none}.page.on{display:block}.hero{padding:34px 36px 30px;background:radial-gradient(circle at 78% 15%,#dff5e8 0,transparent 34%),linear-gradient(180deg,#fff,#f8fcfa)}.eyebrow{font-size:11px;letter-spacing:2.8px;color:var(--g);font-weight:800}.hero h1{font-size:42px;line-height:1.05;margin:8px 0 8px}.hero p{max-width:820px;color:var(--mut);margin:0;font-size:16px}.wrap{padding:0 26px 36px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(16,32,51,.05);margin-top:14px}.click{cursor:pointer;transition:.2s transform,.2s box-shadow}.click:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(16,32,51,.09)}.label{font-size:13px;color:var(--mut)}.num{font-size:31px;font-weight:850;margin:6px 0}.delta{font-size:13px;color:var(--g);font-weight:800}.bad{color:var(--bad)}.title{font-size:18px;font-weight:800;margin-bottom:12px}.bar{height:10px;background:#edf1f2;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#56c583,#0b8f52)}.rows .r{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}.pill{padding:5px 9px;border-radius:999px;background:var(--g2);color:#08743f;font-weight:800;font-size:11px}.pill.bad{background:#fde8e6;color:#a93226}.seg{display:flex;gap:7px;margin-bottom:12px}.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}.seg button.on{background:#111827;color:#fff}.chart{height:210px;display:flex;align-items:end;gap:9px;padding:14px 4px 0;border-top:1px solid var(--line)}.chart div{flex:1;background:linear-gradient(180deg,#87d7a7,#0b8f52);border-radius:9px 9px 3px 3px;min-width:18px;position:relative}.chart div span{position:absolute;bottom:-23px;width:100%;text-align:center;font-size:10px;color:var(--mut)}.model{padding:20px}.model b{font-size:16px}.model p{margin:8px 0 0;color:var(--mut);font-size:13px}.metricline{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}.metricline span{font-weight:800}.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stage{border:1px solid var(--line);background:#fbfdfc;border-radius:14px;padding:14px;text-align:center}.stage b{display:block;font-size:24px}.stage small{color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#fafafa}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:block;font-size:12px;color:var(--mut);font-weight:800;margin-bottom:5px}.f input,.f select,.f textarea{width:100%;padding:11px;border:1px solid #d7dde3;border-radius:10px;background:white}.f textarea{min-height:84px}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.drawer{position:fixed;right:-420px;top:0;width:390px;max-width:92vw;height:100vh;background:#fff;z-index:20;box-shadow:-10px 0 35px rgba(0,0,0,.12);transition:.25s;padding:22px;overflow:auto}.drawer.on{right:0}.drawer h2{margin-top:30px}.close{float:right;border:0;background:#eef2f3;border-radius:9px;padding:8px 10px;cursor:pointer}.attention details{border-top:1px solid var(--line);padding:11px 0}.attention summary{cursor:pointer;font-weight:700}.footer{padding:18px 26px;background:#fff;border-top:1px solid var(--line);color:var(--mut);font-size:12px}@media(max-width:980px){.grid4,.grid3,.grid2,.funnel,.form{grid-template-columns:1fr}.hero{padding:26px 18px}.hero h1{font-size:34px}.wrap{padding:0 12px 26px}header{padding:10px 12px}}</style></head><body><header><div class='brand'>Reliability</div><nav id='nav'></nav><div class='avatar'>PK</div></header><main id='app'></main><aside id='drawer' class='drawer'><button class='close' onclick='closeDrawer()'>✕</button><div id='drawerBody'></div></aside><div class='footer'>Executive Reliability Hub • interactive review mode</div><script>const pages=[['home','Home'],['product','Product'],['engineering','Engineering'],['psmart','PSMART + AI'],['re','Resolution Engineering'],['automation','Automation'],['monitoring','Monitoring'],['weekly','Weekly Review'],['mywork','My Work'],['update','Update']];const data={product:['18','15','12','2.8d'],engineering:['70%','84','$3.6M','6 / 8'],psmart:['24','16','$1.5M','76%'],re:['42','31','$1.8M','28d'],automation:['18','14','14,200','$0.9M'],monitoring:['46','87%','16','31'],weekly:['12','4','8','6'],mywork:['8','3','1','2']};function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button data-id='${p[0]}' onclick="go('${p[0]}')">${p[1]}</button>`).join('')}function hero(t,s){return `<div class='hero'><div class='eyebrow'>RELIABILITY</div><h1>${t}</h1><p>${s}</p></div>`}function kpi(label,num,delta,detail){return `<div class='card click' onclick="openDrawer('${label}','${detail}')"><div class='label'>${label}</div><div class='num'>${num}</div><div class='delta'>${delta}</div></div>`}function home(){return `${hero('A more resilient organization','Executive view of reliability trajectory, predicted savings, realized value, weekly movement and leadership attention.')}<div class='wrap'><div class='grid4'>${kpi('Predicted savings','$8.7M','+$1.1M vs prior forecast','Forecast combines active engineering, automation and validated opportunities.')} ${kpi('Realized savings YTD','$5.2M','+$0.6M WoW','Realized value posted from completed and validated Reliability initiatives.')} ${kpi('Reliability progress','72%','+4 pts WoW','Portfolio progress is improving but remains 3 points below current plan.')} ${kpi('Critical milestones','7 / 9','2 need attention','Two milestones are at risk due to access and dependent development capacity.')}</div><div class='grid2'><div class='card'><div class='title'>Progress to Year End</div><div class='seg'><button class='on' onclick="range(this,'8W')">8W</button><button onclick="range(this,'4W')">4W</button><button onclick="range(this,'YTD')">YTD</button></div><div id='chart' class='chart'></div><div class='rows' style='margin-top:28px'><div class='r'><span>Current</span><b>72%</b></div><div class='r'><span>Plan</span><b>75%</b></div><div class='r'><span>Forecast</span><b>88%</b></div></div></div><div class='card'><div class='title'>Savings outlook</div><div class='rows'><div class='r'><span>Realized</span><b>$5.2M</b></div><div class='r'><span>Committed forecast</span><b>$3.5M</b></div><div class='r'><span>Opportunity pipeline</span><b>$4.1M</b></div><div class='r'><span>Confidence</span><span class='pill'>High</span></div></div><div class='bar' style='margin-top:16px'><i style='width:76%'></i></div></div></div><div class='card'><div class='title'>Reliability Operating Model</div><div class='grid3'><div class='card model click' onclick="go('product')"><b>Product</b><p>Intake → qualify → prioritize → route</p><div class='metricline'><span>18 intakes</span><span>2.8d route</span></div></div><div class='card model click' onclick="go('engineering')"><b>Engineering</b><p>PSMART + AI • RE • Automation</p><div class='metricline'><span>$3.6M value</span><span>84 active</span></div></div><div class='card model click' onclick="go('monitoring')"><b>Monitoring & Advancement</b><p>Assess → identify gaps → track → validate</p><div class='metricline'><span>87% coverage</span><span>16 gaps</span></div></div></div></div><div class='grid2'><div class='card'><div class='title'>This Week</div><div class='funnel'><div class='stage'><b>12</b><small>Moved forward</small></div><div class='stage'><b>8</b><small>Unblocked</small></div><div class='stage'><b>4</b><small>Newly blocked</small></div><div class='stage'><b>6</b><small>No movement</small></div><div class='stage'><b>9</b><small>Validated</small></div></div></div><div class='card attention'><div class='title'>Leadership Attention</div><details><summary>3 off-track initiatives</summary><p class='label'>Two RE initiatives and one monitoring dependency require intervention.</p></details><details><summary>4 access dependencies</summary><p class='label'>Partner access is holding validation and implementation.</p></details><details><summary>3 development handoffs</summary><p class='label'>Awaiting dependent team capacity.</p></details></div></div></div>`}function generic(id,title,sub,labels){let d=data[id];return `${hero(title,sub)}<div class='wrap'><div class='grid4'>${kpi(labels[0],d[0],'+ WoW','Click for detail')}${kpi(labels[1],d[1],'Improving','Click for detail')}${kpi(labels[2],d[2],'On track','Click for detail')}${kpi(labels[3],d[3],'Stable','Click for detail')}</div><div class='grid2'><div class='card'><div class='title'>Week-over-Week Performance</div><table><tr><th>Metric</th><th>Last Week</th><th>This Week</th><th>Direction</th></tr><tr><td>Completion</td><td>64%</td><td>69%</td><td><span class='pill'>Improving</span></td></tr><tr><td>Open backlog</td><td>42</td><td>38</td><td><span class='pill'>Improving</span></td></tr><tr><td>Blocked</td><td>7</td><td>4</td><td><span class='pill'>Improving</span></td></tr></table></div><div class='card'><div class='title'>Movement</div><div class='rows'><div class='r'><span>Forward</span><b>12</b></div><div class='r'><span>Blocked</span><b class='bad'>4</b></div><div class='r'><span>Unblocked</span><b>8</b></div></div></div></div></div>`}function product(){return `${hero('From intake to impact','Product is the Reliability front gate for qualification, prioritization and routing.')}<div class='wrap'><div class='grid4'>${kpi('New intakes','18','+6 WoW','New demand entering Reliability.')}${kpi('Qualified','15','+3','Intakes meeting Reliability criteria.')}${kpi('Prioritized','12','Stable','Items sequenced for execution.')}${kpi('Time to route','2.8d','-1.4d','Average intake-to-routing time.')}</div><div class='card'><div class='title'>Intake Flow</div><div class='funnel'><div class='stage'><b>18</b><small>Intake</small></div><div class='stage'><b>15</b><small>Qualified</small></div><div class='stage'><b>12</b><small>Prioritized</small></div><div class='stage'><b>10</b><small>Routed</small></div><div class='stage'><b>3</b><small>Deferred</small></div></div></div></div>`}function update(){return `${hero('Team Update Center','Self-service weekly update with Azure DevOps enrichment fields.')}<div class='wrap'><div class='card'><form class='form' onsubmit='save(event)'><div class='f'><label>Initiative ID</label><input value='RE-101'></div><div class='f'><label>Intake ID</label><input value='INT-1042'></div><div class='f'><label>Team</label><select><option>Resolution Engineering</option><option>PSMART + AI / Analytics</option><option>Automation Office</option><option>Monitoring & Advancement</option><option>Product</option></select></div><div class='f'><label>Status</label><select><option>Green</option><option>Amber</option><option>Red</option></select></div><div class='f'><label>Progress %</label><input type='number' value='72'></div><div class='f'><label>Trend</label><select><option>Improving</option><option>Stable</option><option>Declining</option></select></div><div class='f'><label>Azure DevOps Work Item ID</label><input value='4100'></div><div class='f'><label>ADO Work Item Type</label><select><option>Epic</option><option>Feature</option><option selected>User Story</option><option>Task</option><option>Bug</option></select></div><div class='f full'><label>What changed this week?</label><textarea>Implementation progressed and blocker removed.</textarea></div><div class='f full'><label>Next week commitment</label><textarea>Move to validation.</textarea></div><div class='f'><label>Forecast value</label><input value='400000'></div><div class='f'><label>Realized value</label><input value='250000'></div><div class='full'><button class='btn'>Save weekly update</button> <span id='saved' class='label'></span></div></form></div></div>`}function page(id){if(id==='home')return home();if(id==='product')return product();if(id==='update')return update();if(id==='engineering')return generic(id,'Engineering','Portfolio roll-up for PSMART + AI, Resolution Engineering and Automation Office.',['Progress','Active','Value','Milestones']);if(id==='psmart')return generic(id,'PSMART + AI / Analytics','Data → insight → decision → Reliability action.',['Active use cases','Completed YTD','Value enabled','On track']);if(id==='re')return generic(id,'Resolution Engineering','Problem → analyze → engineer → implement → validate → benefit.',['Active RE','Completed YTD','Annual savings','Time to implement']);if(id==='automation')return generic(id,'Automation Office','Manual effort → candidate → build → deploy → adoption → benefit.',['Active automations','Production YTD','Hours removed','Value']);if(id==='monitoring')return generic(id,'Monitoring & Advancement','Assess → identify gap → route → track → validate.',['Services assessed','Coverage','Open gaps','Closed gaps']);if(id==='weekly')return generic(id,'Weekly Reliability Review','Meeting-ready weekly movement, blockers, reasons and leadership asks.',['Moved forward','Newly blocked','Unblocked','No movement >2w']);if(id==='mywork')return generic(id,'My Work','Owned initiatives, updates due, blockers and opportunities.',['My initiatives','Updates due','Blocked','Opportunities']);}function go(id){document.getElementById('app').innerHTML=page(id);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));location.hash=id;window.scrollTo({top:0,behavior:'smooth'});if(id==='home')draw([46,52,55,60,64,67,69,72],['W1','W2','W3','W4','W5','W6','W7','W8'])}function draw(vals,labs){document.getElementById('chart').innerHTML=vals.map((v,i)=>`<div style='height:${v+35}px'><span>${labs[i]}</span></div>`).join('')}function range(btn,r){btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(r==='4W')draw([60,64,69,72],['W5','W6','W7','W8']);else if(r==='YTD')draw([28,35,41,48,52,58,63,67,72],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep']);else draw([46,52,55,60,64,67,69,72],['W1','W2','W3','W4','W5','W6','W7','W8'])}function openDrawer(t,d){document.getElementById('drawerBody').innerHTML=`<h2>${t}</h2><p>${d}</p><div class='card'><div class='title'>Trend</div><div class='rows'><div class='r'><span>Current</span><b>Improving</b></div><div class='r'><span>Confidence</span><span class='pill'>High</span></div><div class='r'><span>Leadership action</span><b>Review exceptions</b></div></div></div>`;document.getElementById('drawer').classList.add('on')}function closeDrawer(){document.getElementById('drawer').classList.remove('on')}function save(e){e.preventDefault();document.getElementById('saved').textContent='Saved in review mode ✓'}nav();go((location.hash||'#home').slice(1));</script></body></html>
